name: Learning V30 - validacao de engenharia
on:
  push:
    branches: [v30-prehomologacao]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v30-prehomolog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-isolated:
    if: github.ref == 'refs/heads/v30-prehomologacao'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Node 24 and run mandatory original and V30 suites
        run: docker build --progress=plain --no-cache -t learning-v30-ci .
