name: Learning Academy - build and security gate
on:
  pull_request:
    branches: [homologacao-dna, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learning-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build isolated image and run Dockerfile tests
        run: docker build --tag learning-academy:ci .
