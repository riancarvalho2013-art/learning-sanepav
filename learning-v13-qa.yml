name: Learning — Homologação V13
on:
  push:
    branches: [homologacao-dna]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learning-v13-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    if: github.ref == 'refs/heads/homologacao-dna'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node and regression
        shell: bash
        run: |
          set -o pipefail
          node --version
          npm test 2>&1 | tee regression.log
          npm run test:security 2>&1 | tee security.log
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Full checkout E2E and restored server
        shell: bash
        run: |
          set -o pipefail
          python verify-browser-v13.py 2>&1 | tee browser.log
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-v13-qa-${{ github.sha }}
          path: |
            regression.log
            security.log
            browser.log
          if-no-files-found: ignore
          retention-days: 14
