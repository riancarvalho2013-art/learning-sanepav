name: Learning V30 - navegador autenticado
on:
  push:
    branches: [v30-prehomologacao]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.ref == 'refs/heads/v30-prehomologacao'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - run: npx --no-install playwright install --with-deps chromium
      - run: node build.mjs
      - run: node verify-tenant-browser-v30.mjs
        env:
          LEARNING_BROWSER_EVIDENCE: browser-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-v30-browser-evidence
          path: browser-evidence/
          if-no-files-found: ignore
